name: relay
on:
  schedule:
    # GitHub 스케줄은 지연·누락이 잦다(첫 예정 실행 9/7 06:45가 통째로 빠짐). 정각·45분 회피 + 재시도 크론.
    # 파이프라인은 멱등이라 두 번 돌아도 같은 결과. 정시 트리거는 Mac launchd(ops/)가 맡고 이 cron은 백업.
    - cron: "47 21 * * 0-4"   # 06:47 KST 월–금 morning
    - cron: "20 22 * * 0-4"   # 07:20 KST 월–금 morning 재시도
    - cron: "9 0 * * 1-5"     # 09:09 KST 월–금 open
    - cron: "40 0 * * 1-5"    # 09:40 KST 월–금 open 재시도 (야후 시가 반영 지연 대비)
    - cron: "30 1 * * 1-5"    # 10:30 KST 월–금 open 추가 재시도
    - cron: "40 6 * * 1-5"    # 15:40 KST 월–금 close (오늘 마감 반영, 저녁 박자)
    - cron: "10 7 * * 1-5"    # 16:10 KST 월–금 close 재시도 (야후 종가 반영 지연 대비)
  workflow_dispatch:
    inputs:
      phase:
        description: 실행 단계 (오늘 자료는 실제 실행 시각으로 보정)
        type: choice
        options: [morning, open, close, backfill, restyle]
        default: morning
      date: { description: "YYYY-MM-DD (재현용, 비우면 오늘)", type: string, default: "" }
      days: { description: "backfill 거래일 수", type: string, default: "20" }
permissions: {}
concurrency: relay
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }   # gh-pages에 days/*.json·latest.json을 쌓는다. 다음 실행이 여기서 복원한다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python test_missing_prices.py && python test_headline.py && python test_signal_evaluation.py && python test_web.py
      - run: python relay.py "$PHASE" "${DAYS:-20}"
        env:
          PHASE: ${{ inputs.phase || 'morning' }}
          RELAY_DATE: ${{ github.event.inputs.date }}
          DAYS: ${{ github.event.inputs.days }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mjs0611.github.io/kospi-relay' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      - name: Persist data and pages to gh-pages
        run: |
          git -C site add --all
          if git -C site diff --cached --quiet; then echo 'No changes; no commit.'; exit 0; fi
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site commit -m "relay: $PHASE $GITHUB_SHA"
          git -C site push origin HEAD:refs/heads/gh-pages
        env:
          PHASE: ${{ inputs.phase || 'morning' }}
      # 변경이 없어도 올린다. 재시도 실행이 실패한 Pages 배포를 복구한다.
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write, contents: read }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
