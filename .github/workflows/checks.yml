name: relay-checks
on:
  push:
    paths: ['*.py', 'requirements.txt', 'ops/**', '.github/workflows/**']
  pull_request:
    paths: ['*.py', 'requirements.txt', 'ops/**', '.github/workflows/**']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python test_missing_prices.py && python test_headline.py && sh -n ops/dispatch.sh
